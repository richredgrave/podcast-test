name: Generate & Deploy Podcast Feed

on:
  push:
    branches: [main]
    paths:
      - feed.yaml
      - generate_feed.py
      - audio/**
      - images/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate RSS feed
        env:
          CUSTOM_BASE_URL: ${{ vars.BASE_URL }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE_URL="${CUSTOM_BASE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}}"
          python generate_feed.py --base-url "$BASE_URL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
